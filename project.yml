# XcodeGen spec. Generate the Xcode project on a Mac:
#   brew install xcodegen && xcodegen generate && open Orbit.xcodeproj
#
# Branding: change BRAND_NAME / BUNDLE_ID below AND Orbit/App/Brand.swift.

name: Orbit

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    BRAND_NAME: Orbit
    BUNDLE_ID: com.example.orbit
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    # zsign (MIT) is vendored in Orbit/Vendor/zsign; OpenSSL comes from SPM.
    HEADER_SEARCH_PATHS: $(SRCROOT)/Orbit/Vendor/zsign $(SRCROOT)/Orbit/Vendor/zsign/common $(SRCROOT)/Orbit/Vendor/zsign/third-party/zlib
    GCC_WARN_INHIBIT_ALL_WARNINGS: YES

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL
    from: "3.3.2000"

targets:
  Orbit:
    type: application
    platform: iOS
    sources:
      - path: Orbit
    dependencies:
      - package: ZIPFoundation
      - package: OpenSSL
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID)
        PRODUCT_NAME: $(BRAND_NAME)
        INFOPLIST_FILE: Orbit/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: Orbit/Core/Signing/Orbit-Bridging-Header.h
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
