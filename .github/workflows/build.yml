name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set +e
          xcodebuild -project Orbit.xcodeproj -scheme Orbit -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > xcodebuild.log 2>&1
          status=$?
          tail -n 30 xcodebuild.log
          if [ $status -ne 0 ]; then
            echo "===== errors ====="
            grep -E "error:" -B2 -A4 xcodebuild.log | head -n 400
            exit $status
          fi

      - name: Verify zsign is compiled in
        run: |
          BIN=build/Build/Products/Release-iphoneos/Orbit.app/Orbit
          nm "$BIN" | grep -q "ZBundle" || { echo "::error::zsign symbols missing from binary"; exit 1; }
          echo "zsign linked OK"

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/Orbit.app Payload/
          zip -qry Orbit.ipa Payload
          ls -lh Orbit.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-ipa
          path: Orbit.ipa

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Orbit build ${{ github.run_number }}
          body: Unsigned IPA built from ${{ github.sha }}. Sign it yourself (e.g. SideStore).
          files: Orbit.ipa
